name: PortableDoc code release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the release gates and owner bootstrap are complete
        type: boolean
        default: false
      approved_sha256:
        description: SHA-256 of the exact tarball tested by Barkpark (required for publish)
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Verify the exact release tarball and dry-run publish
        run: |
          test "$(node -p 'require("./packages/code/package.json").name')" = '@portable-doc/code'
          test "$(node -p 'require("./packages/code/package.json").version')" = '0.1.0-alpha.1'
          npm run code:pack -- "$RUNNER_TEMP/portable-doc-code-release"
          tarball="$RUNNER_TEMP/portable-doc-code-release/portable-doc-code-0.1.0-alpha.1.tgz"
          test -f "$tarball"
          npm run code:smoke -- "$tarball"
          cd "$RUNNER_TEMP/portable-doc-code-release"
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 3 SHA256SUMS)" = 'portable-doc-code-0.1.0-alpha.1.tgz'
          test "$(node -p 'require("./provenance.json").artifact.filename')" = 'portable-doc-code-0.1.0-alpha.1.tgz'
          test "$(node -p 'require("./provenance.json").artifact.browserAssetSha256')" = '1cb902e40797ebedc061cea8d4989419c32ae3b1841f31b943752858713942dc'
          npm publish portable-doc-code-0.1.0-alpha.1.tgz --access public --tag alpha --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: portable-doc-code-0.1.0-alpha.1
          path: ${{ runner.temp }}/portable-doc-code-release/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-24.04
    environment: portable-doc-code-release
    permissions:
      id-token: write
    concurrency: portable-doc-code-publish
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v4
        with:
          name: portable-doc-code-0.1.0-alpha.1
      - name: Verify approved digest and publish with provenance
        env:
          PUBLISH_ENABLED: ${{ vars.PORTABLE_DOC_CODE_PUBLISH_ENABLED }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          test "$PUBLISH_ENABLED" = true
          test -n "$APPROVED_SHA256"
          test "$(find . -maxdepth 1 -name 'portable-doc-code-*.tgz' -print | wc -l | tr -d ' ')" = 1
          test -f portable-doc-code-0.1.0-alpha.1.tgz
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$APPROVED_SHA256"
          test "$(cut -d ' ' -f 3 SHA256SUMS)" = 'portable-doc-code-0.1.0-alpha.1.tgz'
          test "$(node -p 'require("./provenance.json").source.commit')" = "$GITHUB_SHA"
          test "$(node -p 'require("./provenance.json").package.name')" = '@portable-doc/code'
          test "$(node -p 'require("./provenance.json").package.version')" = '0.1.0-alpha.1'
          test "$(node -p 'require("./provenance.json").artifact.filename')" = 'portable-doc-code-0.1.0-alpha.1.tgz'
          test "$(node -p 'require("./provenance.json").artifact.sha256')" = "$APPROVED_SHA256"
          test "$(node -p 'require("./provenance.json").artifact.browserAssetSha256')" = '1cb902e40797ebedc061cea8d4989419c32ae3b1841f31b943752858713942dc'
          npm publish portable-doc-code-0.1.0-alpha.1.tgz --access public --tag alpha --provenance
