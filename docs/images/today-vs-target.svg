<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">PortableDoc today and target</title>
<desc id="d">Today: Barkpark holds five renderers (Elixir reader as the source of truth, editor canvas, React, Go plus WASM, mobile) and Barkever, barkpark-studio and next-starter carry look-alike copies, so eight renderers drift apart. Target: FRIKKern/portable-doc holds spec, goldens, ops, editor, react, code, validate and mcp; Barkpark, Barkdown, Barkever, barkpark-studio, mobile and Go pin a version and pass the goldens.</desc>
<style>
  svg { --bg:#fbfaf7; --card:#ffffff; --line:#e3e0d6; --ink:#1f1e1b; --muted:#6c6a63; --good:#2c7a4b; --bad:#b3261e; --chip:#f3f1ea; --goodbg:#eef6f0; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#14161a; --card:#1c1f24; --line:#30343b; --ink:#ecebe6; --muted:#9a9ca3; --good:#6cc28f; --bad:#f2b8b5; --chip:#262a30; --goodbg:#1a2a20; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); } .good { fill: var(--good); } .bad { fill: var(--bad); }
  .bg { fill: var(--bg); } .card { fill: var(--card); stroke: var(--line); } .box { fill: none; stroke: var(--line); }
  .chip { fill: var(--chip); } .home { fill: var(--goodbg); stroke: var(--good); stroke-width: 2; }
</style>
<rect class="bg" width="1200" height="560" rx="16"/>
<text x="40" y="64" font-size="30" font-weight="700" letter-spacing="-0.6">Where PortableDoc lives</text>

