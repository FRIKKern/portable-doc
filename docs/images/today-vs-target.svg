<text x="60" y="128" font-size="13" font-weight="700" letter-spacing="1.5" class="muted">TODAY</text>
<text x="60" y="162" font-size="22" font-weight="600">Rules in eight places</text>
<rect x="60" y="184" width="500" height="150" rx="10" class="box"/>
<text x="76" y="210" font-size="15" font-weight="700">FRIKKern/barkpark</text>
<rect x="76" y="226" width="155" height="36" rx="8" class="chip"/><text x="88" y="249" font-size="14">Elixir reader · truth</text>
<rect x="240" y="226" width="155" height="36" rx="8" class="chip"/><text x="252" y="249" font-size="14">Editor canvas</text>
<rect x="404" y="226" width="140" height="36" rx="8" class="chip"/><text x="416" y="249" font-size="14">React</text>
<rect x="76" y="274" width="155" height="36" rx="8" class="chip"/><text x="88" y="297" font-size="14">Go + WASM</text>
<rect x="240" y="274" width="155" height="36" rx="8" class="chip"/><text x="252" y="297" font-size="14">Mobile</text>
<rect x="60" y="352" width="160" height="58" rx="10" class="box"/><text x="74" y="376" font-size="14" font-weight="600">Barkever</text><text x="74" y="397" font-size="12" class="muted">Blocks.tsx copy</text>
<rect x="230" y="352" width="160" height="58" rx="10" class="box"/><text x="244" y="376" font-size="14" font-weight="600">barkpark-studio</text><text x="244" y="397" font-size="12" class="muted">PortableDocView copy</text>
<rect x="400" y="352" width="160" height="58" rx="10" class="box"/><text x="414" y="376" font-size="14" font-weight="600">next-starter</text><text x="414" y="397" font-size="12" class="muted">359-line copy</text>
<text x="60" y="452" font-size="17" font-weight="600" class="bad">✕ eight renderers drift apart</text>
<text x="60" y="478" font-size="14" class="muted">Apps live-load whatever the server serves.</text>
<text x="60" y="500" font-size="14" class="muted">Barkdown's fallback is on contract 1.14; the server is on 1.19.</text>

<rect x="620" y="96" width="540" height="430" rx="12" class="card"/>
<text x="640" y="128" font-size="13" font-weight="700" letter-spacing="1.5" class="muted">TARGET</text>
<text x="640" y="162" font-size="22" font-weight="600">One home, one set of rules</text>
