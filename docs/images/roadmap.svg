<desc id="d">1 of 8 rewards delivered. R0 Kickoff: done, reward: You can see the project. R1 See the drift: now, reward: One heatmap of where the renderers disagree. R2 Safe editing: next, reward: Editor changes proven in all 5 apps. R3 No surprise breaks: later, reward: Every app pins a version it tested. R4 AI-proof docs: later, reward: Broken docs can't be saved. R5 Editor moves home: later, reward: Fast editor work in its own repo. R6 One-line adoption: later, reward: One npm i, the heatmap all green. R7 Public: later, reward: Docs site and playground.</desc>
